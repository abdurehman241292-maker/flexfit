<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlexFit Admin — Dashboard</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .admin-header {
    background: var(--grad-royal); color: var(--ivory);
    padding: 22px 0; border-bottom: 1px solid var(--border-hairline);
  }
  .admin-header .container { display: flex; justify-content: space-between; align-items: center; }
  .admin-header .brand-name { font-size: 1.2rem; }
  .logout-link { color: var(--gold-bright); font-size: 0.8rem; cursor: pointer; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-hairline); margin-bottom: 32px; }
  .tab-btn {
    padding: 14px 24px; background: none; border: none; cursor: pointer;
    font-family: var(--font-display); font-size: 1.05rem; font-weight: 600;
    color: #9a978c; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--royal-navy); border-bottom-color: var(--gold); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .add-form { background: #fff; border: 1px solid var(--border-hairline); padding: 28px; max-width: 520px; margin-bottom: 44px; }
  .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 22px; }
  .admin-card { background: #fff; border: 1px solid var(--border-hairline); }
  .admin-card img { width: 100%; aspect-ratio: 4/5; object-fit: cover; }
  .admin-card .body { padding: 14px 16px; }
  .admin-card .name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
  .admin-card .price { color: var(--gold); font-weight: 700; margin: 4px 0 10px; }
  .del-btn { background: none; border: 1px solid var(--crimson); color: var(--crimson); font-size: 0.72rem; padding: 7px 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; }
  .orders-table { width: 100%; border-collapse: collapse; background: #fff; }
  .orders-table th, .orders-table td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border-hairline); font-size: 0.88rem; }
  .orders-table th { background: var(--grad-royal); color: var(--gold-bright); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .status-badge { padding: 3px 10px; font-size: 0.72rem; border-radius: 20px; text-transform: capitalize; }
  .status-new { background: #fff3cd; color: #8a6d00; }
  .status-confirmed { background: #d4edda; color: #1e6b31; }
  .status-shipped { background: #cfe2ff; color: #084298; }
  .status-cancelled { background: #f8d7da; color: #842029; }
</style>
</head>
<body>

<header class="admin-header">
  <div class="container">
    <div class="brand">
      <div class="crest"><span>FF</span></div>
      <div class="brand-name">FlexFit Admin</div>
    </div>
    <span class="logout-link" id="logoutBtn">Log Out</span>
  </div>
</header>

<main class="container" style="padding-top:36px;">
  <div class="tabs">
    <button class="tab-btn active" data-tab="products">Products</button>
    <button class="tab-btn" data-tab="orders">Orders</button>
  </div>

  <!-- PRODUCTS TAB -->
  <div class="tab-panel active" id="tab-products">
    <div class="add-form">
      <h3 style="margin-bottom:20px;">List a New Item</h3>
      <form id="addForm">
        <div class="field">
          <label>Product Name</label>
          <input type="text" id="pName" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Price (Rs.)</label>
            <input type="number" id="pPrice" required>
          </div>
          <div class="field">
            <label>Category</label>
            <select id="pCategory" required>
              <option value="shirts">Shirts</option>
              <option value="caps">Caps</option>
              <option value="trousers">Trousers</option>
              <option value="jackets">Jackets</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Description (optional)</label>
          <input type="text" id="pDescription">
        </div>
        <div class="field">
          <label>Picture</label>
          <input type="file" id="pImage" accept="image/*" required>
        </div>
        <button type="submit" class="btn btn-solid btn-block">Add to Store</button>
        <div class="form-msg" id="addMsg"></div>
      </form>
    </div>

    <h3 style="margin-bottom:20px;">Current Listings</h3>
    <div class="admin-grid" id="productGrid"><div class="empty-state">Loading…</div></div>
  </div>

  <!-- ORDERS TAB -->
  <div class="tab-panel" id="tab-orders">
    <table class="orders-table">
      <thead>
        <tr><th>Items</th><th>Customer</th><th>Phone</th><th>Address</th><th>Total</th><th>Status</th><th>Date</th></tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>
</main>

<script>
// --- auth check ---
(async function checkAuth() {
  const res = await fetch("/api/auth/check", { credentials: "include" });
  const data = await res.json();
  if (!data.isAdmin) window.location.href = "login.html";
})();

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
  window.location.href = "login.html";
});

// --- tabs ---
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
    if (btn.dataset.tab === "orders") loadOrders();
  });
});

// --- load products ---
async function loadProducts() {
  const grid = document.getElementById("productGrid");
  const res = await fetch("/api/products");
  const products = await res.json();
  if (!products.length) {
    grid.innerHTML = `<div class="empty-state">Nothing listed yet.</div>`;
    return;
  }
  grid.innerHTML = products.map(p => `
    <div class="admin-card">
      <img src="${p.image}" alt="${p.name}">
      <div class="body">
        <div class="name">${p.name}</div>
        <div class="price">Rs. ${Number(p.price).toLocaleString()} · ${p.category}</div>
        <button class="del-btn" onclick="deleteProduct('${p._id}')">Delete</button>
      </div>
    </div>
  `).join("");
}

async function deleteProduct(id) {
  if (!confirm("Remove this item from the store?")) return;
  await fetch(`/api/products/${id}`, { method: "DELETE", credentials: "include" });
  loadProducts();
}

// --- add product ---
document.getElementById("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("addMsg");
  msg.textContent = "Uploading…";
  msg.className = "form-msg";

  const formData = new FormData();
  formData.append("name", document.getElementById("pName").value);
  formData.append("price", document.getElementById("pPrice").value);
  formData.append("category", document.getElementById("pCategory").value);
  formData.append("description", document.getElementById("pDescription").value);
  formData.append("image", document.getElementById("pImage").files[0]);

  try {
    const res = await fetch("/api/products", {
      method: "POST",
      credentials: "include",
      body: formData,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to add product");
    msg.textContent = "Listed successfully.";
    msg.className = "form-msg success";
    document.getElementById("addForm").reset();
    loadProducts();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "form-msg error";
  }
});

// --- load orders ---
async function loadOrders() {
  const body = document.getElementById("ordersBody");
  const res = await fetch("/api/orders", { credentials: "include" });
  const orders = await res.json();
  if (!orders.length) {
    body.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;">No orders yet.</td></tr>`;
    return;
  }
 body.innerHTML = orders.map(o => `
    <tr>
      <td>${(o.items || []).map(i => `${i.name} (${i.size}) x${i.quantity}`).join("<br>")}</td>
      <td>${o.customerName}</td>
      <td>${o.phone}</td>
      <td>${o.address || ""}${o.city ? ", " + o.city : ""}</td>
      <td>Rs. ${Number(o.totalAmount || 0).toLocaleString()}</td>
      <td><span class="status-badge status-${o.status}">${o.status}</span></td>
      <td>${new Date(o.createdAt).toLocaleDateString()}</td>
    </tr>
  `).join("");
}

loadProducts();
</script>
</body>
</html>
